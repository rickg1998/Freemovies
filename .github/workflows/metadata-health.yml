name: RGShows metadata health
on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/metadata-health.yml"

permissions: {}

concurrency:
  group: rgshows-metadata-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check and warm the metadata service
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.request

          url = "https://rgshows-metadata.onrender.com/health"
          deadline = time.monotonic() + 160
          last = "No response"
          while time.monotonic() < deadline:
              try:
                  timeout = min(30, max(1, deadline-time.monotonic()))
                  request = urllib.request.Request(url, headers={"Accept": "application/json", "User-Agent": "RGShows-health/1.0"})
                  with urllib.request.urlopen(request, timeout=timeout) as response:
                      body = response.read(131073)
                      if len(body) > 131072:
                          raise ValueError("Health response too large")
                      data = json.loads(body)
                  endpoints = data.get("endpoints", [])
                  if data.get("status") == "ok" and "/search" in endpoints and "/title/details" in endpoints:
                      print("RGShows metadata service is healthy.")
                      break
                  last = "Unexpected health payload"
              except Exception as error:
                  last = type(error).__name__ + ": " + str(error)
              time.sleep(min(5, max(0, deadline-time.monotonic())))
          else:
              raise SystemExit("Metadata health check failed: " + last)
          PY
